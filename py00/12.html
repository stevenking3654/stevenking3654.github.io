<!DOCTYPE html>
<html>
<head>
    <title>Python Code Tester</title>
    <style>
        .test-result { font-size: 1.2em; margin-bottom: 0.5em; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h1>Paste Python Code + Tests</h1>
    <textarea id="code" rows="20" cols="80"></textarea><br>
    <button onclick="runTests()">Run Tests</button>
    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="app.js"></script>
</body>
</html>
