    #editor { height: 50vh; border-bottom: 2px solid #ccc; }
    #console { background: #1e1e1e; color: #fff; padding: 10px; height: 30vh; overflow-y: auto; font-family: monospace; }

</head>

<div id="buttons">
  <button id="runBtn">Run</button>

</div>
