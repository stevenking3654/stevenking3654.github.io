<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Taste of the Concepts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<section class="concepts-section">
  <div class="concepts-header">
    <h2>A taste of the concepts you’ll cover</h2>
    <p class="concepts-sub">Explore the core skills you’ll build in your learning journey.</p>

    <div class="concepts-filters" role="group" aria-label="Filter by difficulty">
      <button class="filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="beginner" aria-pressed="false">Beginner</button>
      <button class="filter-btn" data-filter="intermediate" aria-pressed="false">Intermediate</button>
      <button class="filter-btn" data-filter="advanced" aria-pressed="false">Advanced</button>
    </div>
  </div>

  <div class="concepts-grid" id="concepts-grid" aria-label="Concepts"></div>

  <p class="concepts-footnote">Tip: click a concept to mark it as explored. Your selections are saved on this device.</p>
</section>

<script src="script.js"></script>
</body>
</html>
