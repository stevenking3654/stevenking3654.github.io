<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Taste of the Concepts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<section class="lw-taste">
  <div class="taste-head">
    <h2>A taste of the concepts you’ll cover</h2>
    <p class="taste-sub">Explore the core skills you’ll build across the Python Quest.</p>

    <div class="taste-controls" role="group" aria-label="Filter by difficulty">
      <button class="filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="beginner" aria-pressed="false">Beginner</button>
      <button class="filter-btn" data-filter="intermediate" aria-pressed="false">Intermediate</button>
      <button class="filter-btn" data-filter="advanced" aria-pressed="false">Advanced</button>
    </div>

    <div class="taste-progress" aria-live="polite">
      <div class="progress-row">
        <span class="progress-label"><strong><span id="taste-complete">0</span>/<span id="taste-total">0</span></strong> concepts explored</span>
        <span class="progress-xp"><span id="taste-xp">0</span> XP preview</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuenow="0" aria-valuemax="100">
        <div class="progress-fill" id="taste-progress-fill"></div>
      </div>
    </div>
  </div>

  <div class="taste-grid" id="taste-grid" aria-label="Concepts"></div>

  <p class="taste-footnote">Tip: click a concept to mark it as explored. Your selections are saved on this device.</p>
</section>

<script src="script.js"></script>
</body>
</html>
